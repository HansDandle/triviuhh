<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Triviuhh – Host</title>
  <script src="/websocket_ip.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --border:  #30363d;
      --text:    #e6edf3;
      --muted:   #8b949e;
      --green:   #3fb950;
      --red:     #f85149;
      --orange:  #f0883e;
      --blue:    #58a6ff;
      --yellow:  #e3b341;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── Top bar ── */
    #topbar {
      background: var(--surface); border-bottom: 2px solid var(--border);
      padding: 10px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0;
    }
    #topbar h1 { font-size: 1.4rem; color: var(--blue); }
    #round-display { font-size: 0.9rem; color: var(--muted); white-space: nowrap; }
    #phase-label {
      font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1.5px;
      background: var(--border); padding: 3px 14px; border-radius: 20px; color: var(--muted);
    }
    #spacer { flex: 1; }
    #timer-num {
      font-size: 2.2rem; font-weight: bold; color: var(--orange);
      min-width: 60px; text-align: right; font-variant-numeric: tabular-nums;
    }

    /* ── Progress bar ── */
    #progress-wrap { height: 5px; background: var(--border); flex-shrink: 0; }
    #progress-bar  { height: 100%; background: var(--blue); width: 100%; transition: width 0.25s linear, background 0.5s; }

    /* ── Paused banner ── */
    #paused-banner {
      display: none; background: #1f3a5f; border-bottom: 2px solid var(--blue);
      text-align: center; padding: 8px; font-weight: 700; color: var(--blue);
      letter-spacing: 2px; text-transform: uppercase; font-size: 0.9rem; flex-shrink: 0;
    }

    /* ── Main layout ── */
    #main { flex: 1; display: flex; overflow: hidden; min-height: 0; }

    /* ── Sidebar ── */
    #sidebar {
      width: 200px; flex-shrink: 0; background: var(--surface);
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
      overflow-y: auto; padding: 12px; gap: 10px;
    }
    #qr-img { width: 100%; border-radius: 6px; background: #fff; padding: 4px; }
    #join-info { font-size: 0.72rem; color: var(--muted); text-align: center; word-break: break-all; }
    #players-heading {
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted);
      padding-top: 4px; border-top: 1px solid var(--border);
    }
    #player-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
    .player-row {
      background: #21262d; border-radius: 6px; padding: 6px 8px;
      display: flex; align-items: center; gap: 6px; font-size: 0.85rem;
    }
    .p-name  { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .p-score { color: var(--orange); font-weight: bold; font-size: 0.82rem; white-space: nowrap; }
    .p-delta { font-size: 0.75rem; font-weight: 700; color: var(--green); white-space: nowrap; }
    .p-status { font-size: 1rem; flex-shrink: 0; }

    /* ── Content ── */
    #content {
      flex: 1; padding: 18px 22px; display: flex; flex-direction: column;
      gap: 14px; overflow-y: auto; min-width: 0;
    }

    /* ── Phase heading ── */
    .phase-heading {
      font-size: 1rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 2px; color: var(--muted);
    }

    /* ── Question box ── */
    .question-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 16px 20px;
    }
    .question-text { font-size: 1.45rem; line-height: 1.5; }
    .question-meta {
      display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;
    }
    .q-pill {
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px;
      padding: 3px 10px; border-radius: 20px; font-weight: 600;
    }
    .q-flavor { background: #1c2d3a; color: var(--blue); border: 1px solid #243a4a; }
    .q-author { background: #21262d; color: var(--muted); border: 1px solid var(--border); }

    /* ── Pregame ── */
    .pregame-wrap {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; flex: 1; gap: 18px; text-align: center;
    }
    .pregame-wrap p  { color: var(--muted); font-size: 1rem; }
    .pregame-count   { font-size: 1.4rem; font-weight: bold; color: var(--text); }
    .rounds-picker   { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 6px 0 18px; }
    .rounds-label    { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); }
    .rounds-controls { display: flex; align-items: center; gap: 16px; }
    .rounds-btn      { background: var(--border); color: var(--text); font-size: 1.4rem; width: 42px; height: 42px;
                       padding: 0; border-radius: 8px; line-height: 1; }
    #rounds-val      { font-size: 2rem; font-weight: 800; color: var(--blue); min-width: 2.5ch; text-align: center; }

    /* ── Submit grid (lietome) ── */
    .submit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .submit-card {
      background: #21262d; border-radius: 8px; padding: 9px 12px;
      display: flex; align-items: center; gap: 8px; font-size: 0.9rem;
      border: 2px solid var(--border); transition: border-color .2s;
    }
    .submit-card.done { border-color: var(--green); color: var(--muted); }
    .submit-card.done .p-submit-name { text-decoration: line-through; }
    .waiting-label { font-size: 0.75rem; color: var(--orange); font-weight: 700; margin-top: 2px; }

    /* ── Answer grid (lieselection) ── */
    .answer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .answer-card { background: #21262d; border: 2px solid var(--border); border-radius: 10px; padding: 14px 18px; }
    .card-num   { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 5px; }
    .card-label { font-size: 1.1rem; font-weight: 700; }
    .vote-bar-wrap {
      margin-top: 10px; background: var(--border); border-radius: 4px;
      height: 6px; position: relative; overflow: hidden;
    }
    .vote-bar { height: 100%; background: var(--blue); border-radius: 4px; transition: width .3s; }
    .vote-count {
      font-size: 0.72rem; color: var(--blue); font-weight: 700;
      margin-top: 4px; display: block;
    }

    /* ── Reveal grid (scoring) ── */
    .reveal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
      align-content: start;
    }
    .reveal-card {
      border-radius: 10px; padding: 14px 16px;
      display: flex; flex-direction: column; gap: 8px;
      border: 2px solid var(--border); background: #21262d;
    }
    .reveal-card.truth {
      background: #0f2d18; border-color: var(--green);
      box-shadow: 0 0 18px rgba(63,185,80,0.2);
    }
    .reveal-card.lie {
      background: #2a1010; border-color: var(--red);
      box-shadow: 0 0 12px rgba(248,81,73,0.12);
    }
    .reveal-badge {
      font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px;
      font-weight: 800; padding: 2px 8px; border-radius: 20px; align-self: flex-start;
    }
    .truth .reveal-badge { background: var(--green); color: #0d1117; }
    .lie   .reveal-badge { background: var(--red);   color: #fff; }
    .reveal-answer { font-size: 1.15rem; font-weight: 800; line-height: 1.3; }
    .truth .reveal-answer { color: var(--green); }
    .lie   .reveal-answer { color: #ff8080; }
    .reveal-lier { font-size: 0.85rem; font-weight: 700; color: var(--orange); }
    .reveal-lier .lier-label { font-size: 0.7rem; font-weight: 400; color: var(--muted); display: block; margin-bottom: 1px; }
    .reveal-fooled, .reveal-guessers { font-size: 0.82rem; line-height: 1.5; }
    .reveal-section-label {
      font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px;
      color: var(--muted); display: block; margin-bottom: 2px;
    }
    .fooled-names  { display: block; font-weight: 700; color: var(--yellow); }
    .guessed-names { display: block; font-weight: 700; color: var(--green); }
    .reveal-nobody { font-size: 0.78rem; color: var(--muted); font-style: italic; }

    /* ── Final scores ── */
    .score-table { width: 100%; border-collapse: collapse; font-size: 1rem; }
    .score-table th {
      text-align: left; padding: 8px 12px; background: #21262d; color: var(--muted);
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;
    }
    .score-table td { padding: 10px 12px; border-bottom: 1px solid #21262d; }
    .score-table .winner td { background: #2a2000; font-size: 1.08rem; }

    /* ── Buttons ── */
    .btn { border: none; border-radius: 8px; cursor: pointer; font-weight: 700; transition: filter .15s; }
    .btn:hover { filter: brightness(1.18); }
    .btn-start  { background: #238636; color: #fff; font-size: 1.4rem; padding: 16px 52px; }
    .btn-skip   { background: #d29922; color: #fff; font-size: 0.9rem; padding: 10px 22px; }
    .btn-pause  { background: #1f6feb; color: #fff; font-size: 0.9rem; padding: 10px 22px; }
    .btn-end    { background: #b91c1c; color: #fff; font-size: 0.9rem; padding: 10px 22px; }
    .btn-accept { background: #1a4a1a; color: var(--green); border: 1px solid var(--green);
                  font-size: 0.72rem; padding: 5px 12px; border-radius: 6px; margin-top: 4px;
                  cursor: pointer; font-weight: 700; transition: background .15s; }
    .btn-accept:hover { background: #238636; color: #fff; }
    .btn-need   { background: #21262d; color: var(--muted); font-size: 1rem; padding: 11px 28px; cursor: default; }
    .allgood    { color: var(--green); font-weight: bold; }

    /* ── Footer ── */
    #footer {
      background: var(--surface); border-top: 2px solid var(--border);
      padding: 10px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    #status-text { flex: 1; color: var(--muted); font-size: 0.85rem; }

    /* ── PIN overlay ── */
    #pin-overlay {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; z-index: 999;
    }
    #pin-overlay h2    { font-size: 1.6rem; color: var(--blue); }
    #pin-overlay p     { color: var(--muted); }
    #pin-input {
      font-size: 2rem; text-align: center; letter-spacing: 1rem;
      background: var(--surface); border: 2px solid var(--border); color: var(--text);
      border-radius: 10px; padding: 14px 24px; width: 200px; outline: none;
    }
    #pin-input:focus { border-color: var(--blue); }
    #pin-error       { color: var(--red); font-size: 0.9rem; min-height: 1.2rem; }
    .btn-pin         { background: var(--blue); color: #fff; font-size: 1.1rem; padding: 12px 40px; }
  </style>
</head>
<body>

  <!-- PIN gate -->
  <div id="pin-overlay">
    <img src="/img/logo.jpg" alt="Triviuhh" style="max-width:260px;width:70%;">
    <h2>Host Login</h2>
    <p>Enter the host PIN to continue</p>
    <input id="pin-input" type="password" inputmode="numeric" maxlength="4"
           placeholder="_ _ _ _" onkeydown="if(event.key==='Enter') checkPin()" />
    <div id="pin-error"></div>
    <button class="btn btn-pin" onclick="checkPin()">Enter</button>
  </div>

  <div id="topbar">
    <h1><img src="/img/logosmall.jpg" alt="Triviuhh" style="height:38px;vertical-align:middle;"></h1>
    <span id="round-display"></span>
    <span id="phase-label">Lobby</span>
    <div id="spacer"></div>
    <span id="timer-num"></span>
  </div>
  <div id="progress-wrap"><div id="progress-bar"></div></div>
  <div id="paused-banner">⏸ GAME PAUSED — waiting to resume</div>

  <div id="main">
    <div id="sidebar">
      <img id="qr-img" src="qrcode.png" alt="QR" />
      <div id="join-info">connecting</div>
      <div id="players-heading">Players (<span id="player-count">0</span>)</div>
      <ul id="player-list"></ul>
    </div>
    <div id="content"></div>
  </div>

  <div id="footer">
    <span id="status-text">Not connected</span>
    <button class="btn btn-pause" id="pause-btn" onclick="pauseGame()">⏸ Pause</button>
    <button class="btn btn-skip"  onclick="advanceState()">⏭ Skip</button>
    <button class="btn btn-end"   onclick="endGame()">⏹ End Game</button>
  </div>

  <script>
    var ws, timerInterval = null;
    var HOST_PIN = '2708';

    // Tracks scores from the previous non-scoring phase so we can show deltas
    var prevScores = {};

    function checkPin() {
      var v = document.getElementById('pin-input').value.trim();
      if (v === HOST_PIN) {
        document.getElementById('pin-overlay').style.display = 'none';
        init();
      } else {
        var err = document.getElementById('pin-error');
        err.textContent = 'Incorrect PIN — try again';
        document.getElementById('pin-input').value = '';
        document.getElementById('pin-input').focus();
        setTimeout(function(){ err.textContent = ''; }, 2000);
      }
    }

    function init() {
      var wsUrl   = get_websocket_ip();
      var host    = wsUrl.split('/')[2].split(':')[0];
      var gameUrl = 'http://' + host + ':8000';
      document.getElementById('join-info').textContent = gameUrl;
      ws = new WebSocket(wsUrl);
      ws.onopen    = function() { ws.send('view:host'); setStatus('Connected — waiting for players'); };
      ws.onclose   = function() { setStatus('Disconnected — reload to reconnect'); };
      ws.onerror   = function() { setStatus('WebSocket error'); };
      ws.onmessage = function(evt) {
        if (evt.data.startsWith('Echo')) return;
        var g; try { g = JSON.parse(evt.data); } catch(e) { return; }
        render(g);
      };
    }

    var lastState = '';

    function render(g) {
      document.getElementById('paused-banner').style.display = g.paused ? 'block' : 'none';
      var pb = document.getElementById('pause-btn');
      pb.textContent      = g.paused ? '▶ Resume' : '⏸ Pause';
      pb.style.background = g.paused ? '#238636' : '';
      document.getElementById('round-display').textContent =
        g.round > 0 ? 'Round ' + g.round + ' / ' + g.total_rounds : '';
      var labels = { pregame:'Lobby', lietome:'Enter your lie', lieselection:'Pick the truth', scoring:'Reveal', finalscoring:'Final scores' };
      document.getElementById('phase-label').textContent = (g.paused ? '⏸ ' : '') + (labels[g.state] || g.state);

      var elapsed   = Date.now() / 1000 - g.phase_started;
      var remaining = Math.max(0, g.phase_duration - elapsed);
      if (g.paused || g.phase_duration === 0) clearCountdown();
      else startCountdown(remaining, g.phase_duration);

      // Snapshot scores just before the scoring reveal so we can show deltas
      if (lastState === 'lieselection' && g.state === 'scoring') {
        prevScores = {};
        g.players.forEach(function(p) { prevScores[p.name] = p.score; });
      }
      if (g.state !== 'scoring') {
        prevScores = {};
      }
      lastState = g.state;

      renderPlayers(g);

      if      (g.state === 'pregame')      renderPregame(g);
      else if (g.state === 'lietome')      renderLieToMe(g);
      else if (g.state === 'lieselection') renderLieSelection(g);
      else if (g.state === 'scoring')      renderScoring(g);
      else if (g.state === 'finalscoring') renderFinalScoring(g);
    }

    function renderPregame(g) {
      var n = g.players.length;
      var rounds = g.total_rounds || 15;
      setStatus(n === 0 ? 'Waiting for players to join' : n + ' player' + (n !== 1 ? 's' : '') + ' ready');
      var btn = n >= 2
        ? '<button class="btn btn-start" onclick="forceStart()">▶ START GAME</button>'
        : '<button class="btn btn-need" disabled>Need at least 2 players</button>';
      document.getElementById('content').innerHTML =
        '<div class="pregame-wrap">' +
        '<img src="/img/logo.jpg" alt="Triviuhh" style="max-width:340px;width:80%;margin-bottom:10px;"><br>' +
        '<p>Scan the QR code or visit <b>' + esc(document.getElementById('join-info').textContent) + '</b></p>' +
        '<p class="pregame-count">' + n + ' player' + (n !== 1 ? 's' : '') + ' ready</p>' +
        '<div class="rounds-picker">' +
          '<span class="rounds-label">Questions per round</span>' +
          '<div class="rounds-controls">' +
            '<button class="btn rounds-btn" onclick="adjustRounds(-1)">&#8722;</button>' +
            '<span id="rounds-val">' + rounds + '</span>' +
            '<button class="btn rounds-btn" onclick="adjustRounds(1)">&#43;</button>' +
          '</div>' +
        '</div>' +
        btn + '</div>';
    }

    function adjustRounds(delta) {
      var el = document.getElementById('rounds-val');
      if (!el) return;
      var cur = parseInt(el.textContent) || 15;
      var next = Math.max(1, Math.min(cur + delta, 50));
      el.textContent = next;
      ws.send('setrounds:' + next);
    }

    function renderLieToMe(g) {
      var done    = g.players.filter(function(p){ return p.lie != null; }).length;
      var total   = g.players.length;
      var waiting = g.players.filter(function(p){ return p.lie == null; }).map(function(p){ return p.name; });
      setStatus('Lies submitted: ' + done + ' / ' + total);
      var cards = g.players.map(function(p) {
        var isDone = p.lie != null;
        return '<div class="submit-card ' + (isDone ? 'done' : '') + '">' +
          '<span>' + (isDone ? '✅' : '⏳') + '</span>' +
          '<span class="p-submit-name">' + esc(p.name) + '</span>' +
          '</div>';
      }).join('');
      var waitMsg = waiting.length && done > 0
        ? '<p class="waiting-label">Still waiting on: ' + esc(waiting.join(', ')) + '</p>'
        : '';
      var allIn = done === total && total > 0 ? '<p class="allgood">✅ All lies in!</p>' : '';
      document.getElementById('content').innerHTML =
        '<div class="phase-heading">✍️ Round ' + g.round + ' — Enter your lie!</div>' +
        questionBox(g) +
        '<div class="submit-grid">' + cards + '</div>' + waitMsg + allIn;
    }

    function renderLieSelection(g) {
      var voted = g.players.filter(function(p){ return p.choice != null; }).length;
      var total = g.players.length;
      setStatus('Votes in: ' + voted + ' / ' + total);

      // Count votes per answer (host-only view)
      var voteCounts = {};
      g.players.forEach(function(p) {
        if (p.choice) voteCounts[p.choice] = (voteCounts[p.choice] || 0) + 1;
      });

      var answers = collectAnswers(g);
      var cards = answers.map(function(ans, i) {
        var votes = voteCounts[ans] || 0;
        var pct   = total > 0 ? (votes / total) * 100 : 0;
        return '<div class="answer-card">' +
          '<div class="card-num">Option ' + (i+1) + '</div>' +
          '<div class="card-label">' + esc(ans) + '</div>' +
          '<div class="vote-bar-wrap"><div class="vote-bar" style="width:' + pct + '%"></div></div>' +
          (votes > 0 ? '<span class="vote-count">' + votes + ' vote' + (votes !== 1 ? 's' : '') + '</span>' : '') +
          '</div>';
      }).join('');
      document.getElementById('content').innerHTML =
        '<div class="phase-heading">🤔 Pick the real answer!</div>' +
        questionBox(g) +
        '<div class="answer-grid">' + cards + '</div>' +
        '<p style="color:var(--muted);font-size:.85rem;">' + voted + ' / ' + total + ' players voted</p>';
    }

    function renderScoring(g) {
      var timerText = document.getElementById('timer-num').textContent;
      setStatus('Revealing answers — next round in ' + timerText);

      // Lies first (alphabetical), truth last — builds suspense
      var lies   = collectAnswers(g).filter(function(a){ return a !== g.answer; });
      var cards  = lies.concat([g.answer]).map(function(ans) {
        var isTruth = ans === g.answer;
        var lier    = findLier(g, ans);
        var fooled  = g.players.filter(function(p){ return p.choice === ans && !isTruth; }).map(function(p){ return p.name; });
        var guessed = g.players.filter(function(p){ return p.choice === ans &&  isTruth; }).map(function(p){ return p.name; });
        var cls   = isTruth ? 'truth' : 'lie';
        var badge = isTruth ? '✅ The Truth' : '❌ Lie';
        var html  = '<div class="reveal-card ' + cls + '">';
        html += '<div class="reveal-badge">' + badge + '</div>';
        html += '<div class="reveal-answer">' + esc(ans) + '</div>';
        if (!isTruth && lier) {
          html += '<div class="reveal-lier"><span class="lier-label">Written by</span>' + esc(lier) + '</div>';
          if (fooled.length) {
            html += '<div class="reveal-fooled">' +
                    '<span class="reveal-section-label">Fooled ' + fooled.length + ' player' + (fooled.length !== 1 ? 's' : '') + '</span>' +
                    '<span class="fooled-names">' + esc(fooled.join(', ')) + '</span></div>';
          } else {
            html += '<div class="reveal-nobody">Nobody was fooled</div>';
          }
          html += '<button class="btn btn-accept" onclick="markCorrect(\'' + esc(ans).replace(/'/g, "\\'") + '\')">✔ Accept as correct</button>';
        }
        if (isTruth) {
          if (guessed.length) {
            html += '<div class="reveal-guessers">' +
                    '<span class="reveal-section-label">Guessed correctly</span>' +
                    '<span class="guessed-names">' + esc(guessed.join(', ')) + '</span></div>';
          } else {
            html += '<div class="reveal-nobody">😬 Nobody guessed it!</div>';
          }
        }
        html += '</div>';
        return html;
      }).join('');

      document.getElementById('content').innerHTML =
        '<div class="phase-heading">🔍 The Truth is Revealed!</div>' +
        questionBox(g) +
        '<div class="reveal-grid">' + cards + '</div>';
    }

    function renderFinalScoring(g) {
      setStatus('Game over! New game starting soon');
      var rows = g.players.map(function(p, i) {
        var medal = ['🥇','🥈','🥉'][i] || (i+1) + '.';
        return '<tr' + (i === 0 ? ' class="winner"' : '') + '>' +
          '<td>' + medal + '</td><td>' + esc(p.name) + '</td>' +
          '<td><i>' + esc(p.lie || '—') + '</i></td>' +
          '<td><b>' + p.score + '</b></td>' +
          '<td style="color:var(--green)">' + (p.correct || 0) + '</td>' +
          '<td style="color:var(--yellow)">' + (p.fooled  || 0) + '</td>' +
          '<td>' + p.likecount + '</td></tr>';
      }).join('');
      document.getElementById('content').innerHTML =
        '<div class="phase-heading">🏆 Final Scores</div>' +
        '<table class="score-table"><thead><tr>' +
        '<th>#</th><th>Player</th><th>Best lie</th><th>Score</th><th>✅ Correct</th><th>😈 Fooled</th><th>❤️ Likes</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table>';
    }

    function renderPlayers(g) {
      document.getElementById('player-count').textContent = g.players.length;
      var list = document.getElementById('player-list');
      list.innerHTML = '';
      var inScoring = g.state === 'scoring' || g.state === 'finalscoring';
      g.players.forEach(function(p) {
        var icon = '';
        if      (g.state === 'pregame')      icon = '';
        else if (g.state === 'lietome')      icon = p.lie    != null ? '✅' : '⏳';
        else if (g.state === 'lieselection') icon = p.choice != null ? '✅' : '⏳';
        var delta = '';
        if (inScoring && prevScores[p.name] !== undefined) {
          var d = p.score - prevScores[p.name];
          if (d > 0) delta = '<span class="p-delta">+' + d + '</span>';
        }
        var li = document.createElement('li');
        li.className = 'player-row';
        li.innerHTML = '<span class="p-name">' + esc(p.name) + '</span>' +
          delta +
          '<span class="p-score">' + p.score + 'pt</span>' +
          '<span class="p-status">' + icon + '</span>';
        list.appendChild(li);
      });
    }

    function questionBox(g) {
      var meta = '';
      if (g.flavor) meta += '<span class="q-pill q-flavor">' + esc(g.flavor) + '</span>';
      if (g.author) meta += '<span class="q-pill q-author">by ' + esc(g.author) + '</span>';
      return '<div class="question-box">' +
        '<div class="question-text">' + esc(g.question) + '</div>' +
        (meta ? '<div class="question-meta">' + meta + '</div>' : '') +
        '</div>';
    }

    function collectAnswers(g) {
      var set = {}; set[g.answer] = true;
      g.players.forEach(function(p){ if (p.lie) set[p.lie] = true; });
      if (g.house_lie) set[g.house_lie] = true;
      return Object.keys(set).sort();
    }

    function findLier(g, lie) {
      if (g.house_lie && g.house_lie === lie) return '🏠 The House';
      var f = g.players.filter(function(p){ return p.lie === lie; });
      return f.length ? f[0].name : null;
    }

    function setStatus(msg) { document.getElementById('status-text').textContent = msg; }

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function armButton(btn, label, action) {
      if (btn.dataset.armed) { action(); return; }
      var orig = btn.textContent;
      btn.dataset.armed = '1';
      btn.textContent = label;
      btn.style.outline = '2px solid var(--orange)';
      var t = setTimeout(function() {
        delete btn.dataset.armed;
        btn.textContent = orig;
        btn.style.outline = '';
      }, 2500);
      btn.dataset.armTimer = t;
    }

    function markCorrect(lie) {
      ws.send('markcorrect:' + lie);
    }

    function forceStart()   { ws.send('forcestart:host'); }
    function advanceState() { ws.send('advancestate:0'); }
    function pauseGame()    { ws.send('pausegame:host'); }
    function endGame() {
      var btn = document.querySelector('.btn-end');
      armButton(btn, '⏹ Confirm?', function() {
        clearTimeout(btn.dataset.armTimer);
        delete btn.dataset.armed;
        btn.textContent = '⏹ End Game';
        btn.style.outline = '';
        ws.send('endgame:host');
      });
    }

    function startCountdown(remaining, total) {
      clearInterval(timerInterval);
      var val = remaining;
      var el  = document.getElementById('timer-num');
      var bar = document.getElementById('progress-bar');
      function tick() {
        var secs = Math.ceil(val);
        el.textContent  = secs > 0 ? secs + 's' : '';
        var pct = total > 0 ? (val / total) * 100 : 0;
        bar.style.width      = pct + '%';
        bar.style.background = pct > 40 ? 'var(--blue)' : pct > 15 ? 'var(--orange)' : 'var(--red)';
        val -= 0.25;
        if (val < -1) clearInterval(timerInterval);
      }
      tick();
      timerInterval = setInterval(tick, 250);
    }

    function clearCountdown() {
      clearInterval(timerInterval);
      document.getElementById('timer-num').textContent = '';
      document.getElementById('progress-bar').style.width = '0%';
    }
  </script>
</body>
</html>
